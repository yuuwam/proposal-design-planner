<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>产品视觉策划方案管理系统</title>
  <style>
    :root{
      --bg:#0f1115;
      --sidebar:#12151b;
      --panel:#191d25;
      --panel-2:#222834;
      --line:#303747;
      --brand:#ffb84d;
      --brand-deep:#ff8a3d;
      --brand-soft:#fff3df;
      --danger:#ff5b6d;
      --ok:#55d99a;
      --main:#f4f6fa;
      --card:#ffffff;
      --ink:#171b24;
      --muted:#697386;
      --border:#e1e6ef;
      --shadow:0 18px 48px rgba(24,32,50,.08);
      --radius:20px;
      --radius-sm:13px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#eef2ff}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    img{max-width:100%}
    .hidden{display:none!important}
    .app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr);background:var(--main)}
    .sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:radial-gradient(circle at 0 0,rgba(255,184,77,.14),transparent 34%),var(--sidebar);border-right:1px solid var(--line);padding:22px 18px;z-index:20}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));box-shadow:0 12px 30px rgba(255,154,61,.28);position:relative;flex:0 0 auto}
    .logo:before,.logo:after{content:"";position:absolute;background:#171717;border-radius:3px}
    .logo:before{width:19px;height:5px;left:11px;top:11px}
    .logo:after{width:19px;height:5px;left:11px;top:24px}
    .brand h1{font-size:17px;line-height:1.15;margin:0;color:#fff}
    .brand p{font-size:11px;color:#8f99ad;margin:5px 0 0}
    .nav-stack{display:flex;flex-direction:column;gap:8px}
    .nav-btn{width:100%;border:1px solid transparent;background:transparent;color:#aab3c5;border-radius:13px;padding:11px 12px;text-align:left;display:flex;align-items:center;gap:10px;transition:.18s}
    .nav-btn:hover{background:#1c212b;color:#fff}
    .nav-btn.active{background:linear-gradient(135deg,rgba(255,184,77,.18),rgba(255,138,61,.08));border-color:rgba(255,184,77,.25);color:#ffdca4}
    .nav-icon{width:25px;height:25px;border-radius:8px;background:#262d39;display:grid;place-items:center;font-size:12px}
    .side-section{margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}
    .side-label{font-size:11px;color:#707b90;text-transform:uppercase;letter-spacing:.12em;margin:0 8px 10px}
    .side-actions{display:grid;gap:9px}
    .side-note{font-size:11px;line-height:1.6;color:#6f798d;margin:18px 8px 0}
    .main{min-width:0;padding:28px;color:var(--ink);overflow:auto}
    .page{max-width:1580px;margin:0 auto}
    .btn{border-radius:12px;padding:10px 13px;background:#fff;color:#283247;border:1px solid #dce2ec;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s;box-shadow:0 7px 18px rgba(20,30,50,.04);white-space:nowrap}
    .btn:hover{transform:translateY(-1px);border-color:#f0b25a;box-shadow:0 10px 24px rgba(20,30,50,.08)}
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-deep));border-color:transparent;color:#171717;font-weight:800}
    .btn.dark{background:#151923;border-color:#151923;color:#fff}
    .btn.danger{background:#fff4f5;color:#d83a4e;border-color:#ffd5da}
    .btn.ghost-dark{background:#1c212b;border-color:#303746;color:#d9dfec;box-shadow:none}
    .btn.ghost-dark:hover{border-color:rgba(255,184,77,.55);color:#fff}
    .btn.small{font-size:12px;padding:7px 10px;border-radius:10px}
    .icon-btn{width:34px;height:34px;padding:0;border-radius:10px}
    .page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#c27a19;margin-bottom:8px}
    .page-header h2{margin:0;color:#151923;font-size:31px;letter-spacing:-.03em}
    .page-header p{margin:8px 0 0;color:var(--muted);font-size:14px}
    .header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .search-box{position:relative;min-width:270px}
    .search-box input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid #dce2ec;border-radius:13px;background:#fff;outline:0;color:#171b24}
    .search-box:before{content:"⌕";position:absolute;left:14px;top:8px;color:#8993a5;font-size:20px}
    .search-box input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,184,77,.14)}
    .project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:17px}
    .project-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:.2s;position:relative}
    .project-card:hover{transform:translateY(-3px);border-color:#f0bd73;box-shadow:0 24px 60px rgba(24,32,50,.12)}
    .project-cover{height:152px;background:linear-gradient(135deg,#202631,#343e50);position:relative;overflow:hidden;cursor:pointer}
    .project-cover img{width:100%;height:100%;object-fit:cover;display:block}
    .project-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.48));pointer-events:none}
    .cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 25% 20%,rgba(255,184,77,.5),transparent 35%),linear-gradient(135deg,#181d26,#384355);color:#ffe6be;font-weight:900;font-size:42px;letter-spacing:-.06em}
    .cover-tag{position:absolute;left:13px;bottom:12px;z-index:2;background:rgba(18,21,27,.75);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 9px;font-size:11px}
    .project-body{padding:15px 16px 16px}
    .project-card-title{font-weight:850;font-size:16px;line-height:1.4;margin:0 34px 7px 0;word-break:break-word;color:#171b24;cursor:pointer}
    .project-card-title:hover{color:#a65f00}
    .project-meta{font-size:12px;color:#778195;display:flex;gap:10px;flex-wrap:wrap}
    .project-card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f5;margin-top:14px;padding-top:12px}
    .updated{font-size:11px;color:#919bad}
    .card-delete{position:absolute;right:12px;top:164px;background:#f7f8fb;border:1px solid #e4e8ef;color:#8791a3;width:30px;height:30px;border-radius:9px;z-index:3}
    .card-delete:hover{background:#fff1f3;border-color:#ffc9d0;color:#d63d51}
    .new-project-card{min-height:290px;border:1.5px dashed #cbd3df;background:rgba(255,255,255,.55);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#667085;transition:.18s}
    .new-project-card:hover{border-color:var(--brand);background:#fffaf2;color:#9b5b08;transform:translateY(-2px)}
    .new-plus{width:50px;height:50px;border-radius:16px;background:var(--brand-soft);display:grid;place-items:center;font-size:28px;color:#a66108}
    .empty-page{background:#fff;border:1px dashed #cbd3df;border-radius:22px;padding:70px 20px;text-align:center;color:#7b8597}
    .workspace-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
    .back-link{display:inline-flex;align-items:center;gap:7px;color:#7b8495;font-size:13px;margin-bottom:8px;cursor:pointer}
    .back-link:hover{color:#a65f00}
    .project-name-input{width:min(760px,100%);border:0;background:transparent;outline:0;font-weight:900;font-size:30px;line-height:1.2;color:#161a22;padding:0}
    .save-meta{font-size:12px;color:#7c8698;margin-top:8px;display:flex;align-items:center;gap:8px}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(85,217,154,.14)}
    .summary-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px;margin-bottom:18px}
    .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .panel-title h3{margin:0;font-size:16px;color:#171b24}
    .panel-title .hint{font-size:11px;color:#8a94a6}
    textarea,input[type="text"]{width:100%;border:1px solid #d9e0ea;background:#fbfcfe;color:#171b24;border-radius:13px;padding:11px 12px;outline:0;line-height:1.55;resize:vertical}
    textarea:focus,input[type="text"]:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,184,77,.14);background:#fff}
    .brief-textarea{min-height:118px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat{padding:14px 12px;border:1px solid #e7ebf2;border-radius:14px;background:#fafbfc}
    .stat strong{font-size:23px;display:block;color:#161b24}
    .stat span{font-size:11px;color:#7a8496}
    .product-panel{margin-bottom:18px}
    .tabs-wrap{position:sticky;top:-28px;z-index:12;background:rgba(244,246,250,.92);backdrop-filter:blur(13px);padding:12px 0 10px;margin-bottom:7px}
    .tabs{display:flex;align-items:center;justify-content:space-between;gap:15px}
    .tab-buttons{display:flex;gap:8px}
    .tab{border:1px solid #dfe4ec;background:#fff;color:#465064;border-radius:13px;padding:11px 18px;font-weight:850;box-shadow:0 6px 16px rgba(20,30,50,.04)}
    .tab.active{background:#161b24;color:#fff;border-color:#161b24}
    .sections{display:flex;flex-direction:column;gap:16px}
    .section{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
    .section-head{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 15px;border-bottom:1px solid #edf0f5;background:linear-gradient(180deg,#fff,#fbfcfe)}
    .section-title-wrap{min-width:0;display:flex;align-items:center;gap:10px;flex:1}
    .section-index{background:#171c25;color:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;flex:0 0 auto}
    .section-title{border:0!important;background:transparent!important;box-shadow:none!important;padding:7px!important;font-weight:850;font-size:17px;min-width:150px}
    .section-title:focus{background:#f5f7fa!important}
    .section-head-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:0 1 580px}
    .size-inline{display:flex;align-items:center;gap:8px;min-width:280px;max-width:410px;flex:1;background:#f8fafc;border:1px solid #e1e6ee;border-radius:13px;padding:7px 8px 7px 11px}
    .size-inline.applyable{max-width:560px}
    .size-inline label{font-size:11px;font-weight:850;color:#7a8496;white-space:nowrap}
    .size-inline input{height:34px;border:0;background:transparent;border-radius:8px;padding:5px 7px;box-shadow:none!important;font-size:12px;font-weight:700;color:#303a4b;flex:1;min-width:0}
    .size-inline input:focus{background:#fff;border:1px solid #f1bd70}
    .size-apply-btn{flex:0 0 auto}
    .section-actions{display:flex;gap:7px;flex-wrap:nowrap}
    .section-body{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;padding:16px}
    .image-column{display:flex;flex-direction:column;gap:12px}
    .image-box{border:1.5px dashed #cbd4e1;border-radius:17px;background:#fafcff;padding:12px;outline:0;transition:.18s}
    .image-box:hover,.image-box.active{border-color:#efad4e;background:#fffaf2;box-shadow:0 0 0 4px rgba(255,184,77,.11)}
    .image-box.drag{border-color:#171c25;background:#f2f5f9}
    .image-box.compact{background:#fbfcfe}
    .image-box-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .image-box h4{font-size:13px;margin:0 0 4px;color:#252c38}
    .hint{font-size:11px;color:#7e899b;line-height:1.5}
    .image-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
    .product-panel .thumbs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
    .thumb{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#edf1f6;border:1px solid #e0e5ed;cursor:zoom-in}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
    .thumb:hover img{transform:scale(1.035)}
    .thumb-delete{position:absolute;right:5px;top:5px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(10,13,18,.72);color:#fff;font-size:15px;line-height:1;padding:0;z-index:2}
    .thumb-delete:hover{background:#d93c50}
    .thumb-size{position:absolute;left:5px;bottom:5px;background:rgba(10,13,18,.68);color:#fff;border-radius:999px;padding:3px 6px;font-size:9px;pointer-events:none}
    .empty-img{border-radius:12px;background:repeating-linear-gradient(135deg,#f0f3f8,#f0f3f8 10px,#f8f9fc 10px,#f8f9fc 20px);padding:17px;text-align:center;color:#7b8596;font-size:12px;margin-top:10px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    .field-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:850;color:#394356}
    textarea.copy{min-height:118px}
    textarea.scene{min-height:116px}
    textarea.prompt{min-height:205px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;line-height:1.65;background:#11151c;color:#e8edf7;border-color:#252c38}
    textarea.prompt:focus{background:#11151c;color:#fff;border-color:#f0ad4c}
    .sync-note{font-size:10px;color:#9ca6b7;font-weight:500}

    .realtime-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;font-size:12px;font-weight:700}
    .realtime-badge.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.realtime-badge.off{background:#f1f5f9;border-color:#d8e0ea;color:#64748b}
    .realtime-dot{width:7px;height:7px;border-radius:999px;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}.realtime-badge.warn .realtime-dot{background:#f59e0b}.realtime-badge.off .realtime-dot{background:#94a3b8;box-shadow:none}
    .presence-list{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.presence-avatar{width:24px;height:24px;border-radius:999px;background:#171b24;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;border:2px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.12)}
    .remote-locked{background:#fff8e8!important;border-color:#f4b44f!important;box-shadow:0 0 0 3px rgba(245,158,11,.11)!important}.remote-locked::placeholder{color:#9a6700!important}
    .prompt-tools{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
    .prompt-list{display:flex;flex-direction:column;gap:12px}
    .prompt-item{border:1px solid #dfe4ec;border-radius:15px;background:#f7f9fc;padding:10px}
    .prompt-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .prompt-item-title{font-size:12px;font-weight:900;color:#424c5f;display:flex;align-items:center;gap:7px}
    .prompt-item-number{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 7px;border-radius:999px;background:#171c25;color:#fff;font-size:10px}
    .prompt-empty{border:1.5px dashed #cbd4e1;border-radius:14px;padding:24px;text-align:center;background:#fafcff;color:#7e899b;font-size:12px}
    .bulk-prompt-panel{margin-bottom:18px}
    .bulk-prompt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
    .bulk-prompt-text{min-height:100px}
    .bulk-prompt-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .mobile-warning{display:none}
    .toast{position:fixed;right:24px;bottom:24px;background:#151923;color:#fff;padding:12px 15px;border-radius:13px;box-shadow:0 18px 55px rgba(0,0,0,.3);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:100;font-size:12px;max-width:390px}
    .toast.show{opacity:1;transform:translateY(0)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(10,13,18,.55);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}
    .modal-backdrop.show{display:flex}
    .modal{width:min(520px,100%);background:#fff;color:#171b24;border-radius:22px;box-shadow:0 28px 90px rgba(0,0,0,.28);padding:20px}
    .modal h3{margin:0 0 15px;font-size:20px}
    .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
    .lightbox{position:fixed;inset:0;background:rgba(4,6,10,.9);display:none;align-items:center;justify-content:center;padding:54px;z-index:110;cursor:zoom-out}
    .lightbox.show{display:flex}
    .lightbox img{max-width:95vw;max-height:88vh;object-fit:contain;border-radius:10px;box-shadow:0 30px 100px rgba(0,0,0,.55);cursor:default}
    .lightbox-close{position:absolute;right:22px;top:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);color:#fff;font-size:24px}
    .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:42px;line-height:1;display:grid;place-items:center;z-index:2}
    .lightbox-nav:hover,.lightbox-close:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.38)}
    .lightbox-prev{left:22px}.lightbox-next{right:22px}
    .lightbox-nav.disabled{opacity:.24;pointer-events:none}
    .lightbox-caption{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:1180px){
      .app{grid-template-columns:230px minmax(0,1fr)}
      .section-body{grid-template-columns:330px minmax(0,1fr)}
      .section-head{align-items:flex-start}
      .section-head-right{flex-basis:480px;flex-wrap:wrap}
      .size-inline{min-width:260px}
    }
    @media(max-width:930px){
      .app{display:block}
      .sidebar{position:relative;height:auto;padding:14px 16px;display:flex;align-items:center;gap:16px;overflow:visible}
      .brand{margin:0;min-width:220px}
      .nav-stack{flex-direction:row;margin-left:auto}
      .nav-btn{width:auto}
      .nav-btn span:last-child{display:none}
      .side-section,.side-note{display:none}
      .main{padding:20px}
      .summary-grid,.section-body{grid-template-columns:1fr}
      .section-head{flex-direction:column;align-items:stretch}
      .section-head-right{max-width:none;flex-basis:auto;justify-content:space-between}
      .size-inline{max-width:none}
      .tabs-wrap{top:0}
    }
    @media(max-width:650px){
      .main{padding:14px}
      .mobile-warning{display:block;margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#fff4e3;border:1px solid #ffd89f;color:#7d4c06;font-size:11px}
      .page-header,.workspace-header,.tabs{align-items:flex-start;flex-direction:column}
      .page-header h2,.project-name-input{font-size:24px}
      .header-actions,.search-box{width:100%}
      .search-box{min-width:0}
      .project-grid{grid-template-columns:1fr}
      .summary-grid{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr 1fr 1fr}
      .form-grid{grid-template-columns:1fr}
      .section-head-right{align-items:stretch;flex-direction:column}
      .size-inline{min-width:0;width:100%;align-items:flex-start;flex-direction:column}
      .section-actions{justify-content:flex-end}
      .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
      .bulk-prompt-row{grid-template-columns:1fr}
      .bulk-prompt-actions{justify-content:stretch}
      .bulk-prompt-actions .btn{flex:1}
      .lightbox{padding:45px 12px}
      .lightbox-nav{width:38px;height:58px;font-size:34px}
      .lightbox-prev{left:8px}.lightbox-next{right:8px}
    }

    .account-email-box{position:fixed;left:18px;bottom:18px;width:244px;z-index:35;background:rgba(18,21,27,.94);border:1px solid rgba(255,184,77,.28);box-shadow:0 18px 45px rgba(0,0,0,.28);border-radius:16px;padding:11px 12px;color:#fff;backdrop-filter:blur(10px)}
    .account-email-box .account-label{font-size:10px;color:#8f99ad;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
    .account-email-box .account-mail{font-size:12px;font-weight:800;color:#fff3df;word-break:break-all;line-height:1.35}
    .account-email-box .account-team{font-size:10px;color:#aab3c5;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:930px){.account-email-box{position:static;width:auto;margin-top:12px}.sidebar{flex-wrap:wrap}.account-email-box .account-team{white-space:normal}}
    .cloud-badge{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid rgba(255,184,77,.32);background:rgba(255,184,77,.10);border-radius:999px;color:#fff3df;font-size:12px;white-space:nowrap}
    .cloud-badge strong{color:#fff;font-weight:800;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cloud-badge button{border:0;background:rgba(255,255,255,.13);color:#fff;border-radius:999px;padding:5px 9px;font-size:11px}
    .cloud-badge.light{background:#fff8ec;color:#6e4d1d;border-color:#f3d7a4}.cloud-badge.light strong{color:#171b24}.cloud-badge.light button{background:#171b24;color:#fff}
    .auth-page{min-height:calc(100vh - 56px);display:grid;grid-template-columns:minmax(0,1.05fr) 430px;gap:28px;align-items:center;padding:38px 0}
    .auth-hero{background:linear-gradient(135deg,#171b24,#232a38);border-radius:28px;padding:38px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}.auth-hero:before{content:"";position:absolute;right:-80px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,184,77,.16)}
    .auth-hero h2{font-size:38px;margin:8px 0 16px}.auth-hero p{color:#cfd6e6;font-size:15px;line-height:1.8;max-width:640px}.auth-points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}.auth-point{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px}.auth-point strong{display:block;color:var(--brand);margin-bottom:6px}.auth-point span{display:block;font-size:12px;color:#d6dceb;line-height:1.6}
    .auth-card{background:#fff;border:1px solid var(--border);border-radius:28px;padding:26px;box-shadow:var(--shadow);color:var(--ink)}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f5fa;border-radius:16px;padding:5px;margin-bottom:18px}.auth-tab{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:800;color:var(--muted)}.auth-tab.active{background:#171b24;color:#fff}.auth-form{display:grid;gap:13px}.auth-form.hidden{display:none!important}.auth-form input{width:100%;height:44px;border:1px solid var(--border);border-radius:14px;padding:0 13px;background:#fff;color:var(--ink)}.auth-help{font-size:12px;color:var(--muted);line-height:1.6}.auth-error{display:none;color:#b42318;background:#fff1f0;border:1px solid #ffccc7;border-radius:13px;padding:10px;font-size:12px;line-height:1.5}.auth-error.show{display:block}.sync-hint{font-size:12px;color:#7a8496;line-height:1.7;margin-top:14px;padding:12px;border-radius:14px;background:#f8fafc;border:1px dashed #d8deea}
    @media (max-width:980px){.auth-page{grid-template-columns:1fr}.auth-points{grid-template-columns:1fr}.auth-hero h2{font-size:30px}.cloud-badge{white-space:normal}}

  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div><h1>Proposal Design Planner</h1><p>电商主图 / 详情页策划管理</p></div>
      </div>
      <nav class="nav-stack">
        <button class="nav-btn" id="navProjects"><span class="nav-icon">▦</span><span>项目列表</span></button>
        <button class="nav-btn" id="navCurrent"><span class="nav-icon">✦</span><span>当前策划</span></button>
      </nav>
      <div class="side-section">
        <div class="side-label">项目操作</div>
        <div class="side-actions">
          <button class="btn primary" id="sideAddProject">＋ 新建项目</button>
          <button class="btn ghost-dark" id="sideExport">导出全部数据</button>
          <button class="btn ghost-dark" id="sideImport">导入数据</button>
        </div>
        <input class="hidden" id="importFile" type="file" accept="application/json" />
      </div>
      <p class="side-note">云端同步保存，浏览器保留本地备份。多人共用同一个团队码即可同步。</p>

    </aside>

    <main class="main">
      <div class="mobile-warning">手机端可查看和编辑，批量上传图片建议使用电脑端。</div>
      <div class="page" id="root"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="projectModal">
    <div class="modal">
      <h3>新建项目</h3>
      <div class="field">
        <div class="field-label">项目名称</div>
        <input id="newProjectName" type="text" placeholder="例如：儿童计时器产品视觉策划" />
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelProject">取消</button>
        <button class="btn primary" id="confirmProject">创建项目</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="上一张">‹</button>
    <img id="lightboxImage" alt="放大预览" />
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="下一张">›</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

<script>
(() => {
  'use strict';
  const DB_NAME = 'proposal-design-planner-db';
  const STORE_NAME = 'state-store';
  const STATE_KEY = 'proposal-planner-state-v2';
  const MAX_IMAGE_BYTES = 1024 * 1024;
  const PROMPT_MARKER = '—— 自定义提示词 ——';

  const defaultMainTitles = [
    '主图 01｜白底产品主图','主图 02｜核心卖点图','主图 03｜功能结构图',
    '主图 04｜使用场景图','主图 05｜尺寸 / 参数图','主图 06｜对比 / 优势图','主图 07｜包装 / 配件清单图'
  ];
  const defaultAplusTitles = [
    '详情页 01｜首屏视觉海报','详情页 02｜核心卖点总览','详情页 03｜功能结构说明',
    '详情页 04｜生活方式场景','详情页 05｜材质 / 细节展示','详情页 06｜尺寸 / 使用步骤','详情页 07｜信任背书 / 售后保障'
  ];

  let db = null;
  let state = null;
  let saveTimer = null;
  let activeImageTarget = null;
  let lightboxGallery = [];
  let lightboxIndex = 0;
  let cloudUser = null;
  let cloudWorkspace = null;
  let cloudApiReady = false;
  let cloudApiError = "";
  let realtimeProjectId = '';
  let realtimeClientId = '';
  let realtimeConnected = false;
  let realtimeUsers = [];
  let realtimeLocks = {};
  let realtimePollTimer = null;
  let realtimePollBusy = false;
  let realtimeSuppress = false;
  let realtimeLastRemoteAt = 0;
  let cloudStateUpdatedAt = '';

  const $ = (s,r=document) => r.querySelector(s);
  const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
  const uid = () => 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-5);
  const nowISO = () => new Date().toISOString();
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const formatTime = iso => {
    if(!iso) return '未保存';
    const d = new Date(iso);
    return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  };
  async function apiFetch(path, options={}){
    const init={credentials:'same-origin',method:options.method||'GET',headers:{...(options.headers||{})}};
    if(options.body!==undefined){init.headers['Content-Type']='application/json';init.body=typeof options.body==='string'?options.body:JSON.stringify(options.body)}
    const res=await fetch(path,init);
    let data=null;try{data=await res.json()}catch(e){}
    if(!res.ok){const err=new Error(data?.message||`请求失败：${res.status}`);err.status=res.status;throw err}
    return data;
  }
  function cloudBadge(theme='dark'){
    if(!cloudUser)return '';
    const name=cloudWorkspace?.name||'云端团队';
    const invite=cloudWorkspace?.inviteCode?`团队码：${esc(cloudWorkspace.inviteCode)}`:'云端已连接';
    return `<div class="cloud-badge ${theme==='light'?'light':''}" title="${esc(invite)}"><span>云端同步</span><strong>${esc(name)}</strong><span>${invite}</span><button data-action="logout-cloud">退出</button></div>`;
  }
  function updateAccountEmailBox(){
    const el=$('#accountEmailBox');
    if(!el)return;
    if(!cloudUser?.email){el.classList.add('hidden');el.innerHTML='';return}
    const team=cloudWorkspace?.name||'当前团队';
    const invite=cloudWorkspace?.inviteCode?` · 团队码 ${cloudWorkspace.inviteCode}`:'';
    el.classList.remove('hidden');
    el.innerHTML=`<div class="account-label">当前登录账号</div><div class="account-mail">${esc(cloudUser.email)}</div><div class="account-team">${esc(team+invite)}</div>`;
  }
  function findRealtimeEl(key){return $$('[data-realtime-key]').find(el=>el.dataset.realtimeKey===key)||null}
  function applyValueByRealtimeKey(targetState,key,value){
    if(!targetState||!key)return;
    const parts=String(key).split(':');
    if(parts[0]==='project'){
      const project=targetState.projects.find(p=>p.id===parts[1]);
      if(project&&['name','brief','bulkPrompt'].includes(parts[2]))project[parts[2]]=value;
      return;
    }
    if(parts[0]==='section'){
      const section=targetState.projects.flatMap(p=>[...(p.mainSections||[]),...(p.aplusSections||[])]).find(s=>s.id===parts[1]);
      if(section&&['title','size','copy','scene'].includes(parts[2]))section[parts[2]]=value;
      return;
    }
    if(parts[0]==='prompt'){
      const section=targetState.projects.flatMap(p=>[...(p.mainSections||[]),...(p.aplusSections||[])]).find(s=>s.id===parts[1]);
      const prompt=section?.prompts?.find(p=>p.id===parts[2]);
      if(prompt)prompt.manual=extractManualPrompt(value);
    }
  }
  async function checkCloudSession(){
    try{const data=await apiFetch('/api/me');cloudUser=data.user;cloudWorkspace=data.workspace;cloudApiReady=true;cloudApiError='';return true}
    catch(e){cloudUser=null;cloudWorkspace=null;cloudApiReady=e.status===401;cloudApiError=e.status===401?'':(e.message||'云端接口未连接，请检查 Pages Functions 和 DB 绑定');return false}
  }
  async function uploadImageToCloud(dataUrl,name){
    if(!cloudUser||!cloudApiReady)return null;
    return apiFetch('/api/images',{method:'POST',body:{dataUrl,name}});
  }


  function realtimeBadgeHtml(){
    const cls=realtimeConnected?'':'warn';
    const text=realtimeConnected?'云端协作同步已开启':'云端协作同步连接中';
    const count=realtimeUsers.length||1;
    const avatars=realtimeUsers.slice(0,5).map(u=>`<span class="presence-avatar" title="${esc(u.userName||u.userEmail||'成员')}">${esc((u.userName||u.userEmail||'成').slice(0,1).toUpperCase())}</span>`).join('');
    return `<span class="realtime-badge ${cls}" id="realtimeStatus"><span class="realtime-dot"></span>${text} · ${count}人在线</span><span class="presence-list" id="presenceList">${avatars}</span>`;
  }
  function updateRealtimeBadge(){
    const status=$('#realtimeStatus'),presence=$('#presenceList');
    if(status){
      status.className=`realtime-badge ${realtimeConnected?'':'warn'}`;
      status.innerHTML=`<span class="realtime-dot"></span>${realtimeConnected?'云端协作同步已开启':'云端协作同步连接中'} · ${(realtimeUsers.length||1)}人在线`;
    }
    if(presence){presence.innerHTML=realtimeUsers.slice(0,5).map(u=>`<span class="presence-avatar" title="${esc(u.userName||u.userEmail||'成员')}">${esc((u.userName||u.userEmail||'成').slice(0,1).toUpperCase())}</span>`).join('')}
    applyRealtimeLocks();
  }
  function connectRealtimeForCurrentProject(){
    const p=getProject();
    if(!cloudUser||!cloudApiReady||state.view!=='workspace'||!p){disconnectRealtime(false);return}
    if(realtimeProjectId===p.id&&realtimePollTimer)return;
    disconnectRealtime(false);
    realtimeProjectId=p.id;
    realtimeClientId=realtimeClientId||uid();
    realtimeConnected=true;
    realtimeUsers=[{clientId:realtimeClientId,userName:cloudUser.name,userEmail:cloudUser.email}];
    updateRealtimeBadge();
    realtimePollTimer=setInterval(pollCloudStateForRealtime,1800);
  }
  function disconnectRealtime(clear=true){
    if(realtimePollTimer)clearInterval(realtimePollTimer);
    realtimePollTimer=null;realtimeProjectId='';realtimeConnected=false;realtimePollBusy=false;
    if(clear){realtimeUsers=[];realtimeLocks={};updateRealtimeBadge()}
  }
  function sendRealtime(){return false}
  function queueRealtimeBroadcast(){
    // Cloudflare Pages cannot define Durable Objects in the same Pages project.
    // This deployable version uses D1 polling: saveState() writes to D1, teammates poll /api/state and apply updates without refreshing.
  }
  async function pollCloudStateForRealtime(){
    if(realtimePollBusy||realtimeSuppress||!cloudUser||!cloudApiReady||state.view!=='workspace'||!getProject())return;
    realtimePollBusy=true;
    try{
      const data=await apiFetch('/api/state');
      if(data?.state&&data.updatedAt&&data.updatedAt!==cloudStateUpdatedAt){
        cloudStateUpdatedAt=data.updatedAt;
        await applyRemoteState(data.state,{userName:'团队成员',userEmail:'云端更新'});
      }
    }catch(e){
      realtimeConnected=false;updateRealtimeBadge();
    }finally{
      realtimePollBusy=false;
    }
  }
  async function applyRemoteState(remoteState,from){
    const active=document.activeElement;
    const activeKey=active?.dataset?.realtimeKey||'';
    const activeValue=activeKey&&('value' in active)?active.value:'';
    const selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
    const selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
    const localView=state.view,localSelected=state.selectedProjectId,localTab=state.activeTab;
    const incoming=migrateState(remoteState);
    if(activeKey)applyValueByRealtimeKey(incoming,activeKey,activeValue);
    state=incoming;
    state.view=localView;
    state.selectedProjectId=incoming.projects.some(p=>p.id===localSelected)?localSelected:(incoming.projects[0]?.id||'');
    state.activeTab=localTab;
    realtimeLastRemoteAt=Date.now();
    realtimeSuppress=true;
    await dbSet(workspaceStateKey(),state);
    realtimeSuppress=false;
    if(state.view==='workspace')renderWorkspace();else renderProjectsPage();
    if(activeKey){
      const restored=findRealtimeEl(activeKey);
      if(restored){
        restored.focus();
        if(selStart!==null&&typeof restored.setSelectionRange==='function'){
          try{restored.setSelectionRange(Math.min(selStart,restored.value.length),Math.min(selEnd??selStart,restored.value.length))}catch(e){}
        }
      }
    }
  }
  function realtimeField(fieldKey,label){return `data-realtime-key="${esc(fieldKey)}" data-realtime-label="${esc(label)}"`}
  function bindRealtimeInputs(){
    $$('[data-realtime-key]').forEach(el=>{
      el.addEventListener('focus',()=>{});
      el.addEventListener('blur',()=>{});
    });
    applyRealtimeLocks();
  }
  function applyRealtimeLocks(){
    $$('[data-realtime-key]').forEach(el=>{
      el.classList.remove('remote-locked');
      el.title='';
      if(el.readOnly)el.readOnly=false;
    });
  }

  function createPrompt(manual=''){return {id:uid(),manual:String(manual||'')}}
  function createSection(title,type='main'){
    return {
      id:uid(), title, referenceImages:[], materialImages:[], copy:'', scene:'',
      size:type==='aplus' ? '1464 × 600 px / 21:9' : '2000 × 2000 px / 1:1',
      prompts:[createPrompt()], updatedAt:nowISO()
    };
  }
  function createProject(name='未命名项目'){
    return {
      id:uid(), name, brief:'', productImages:[], bulkPrompt:'', createdAt:nowISO(), updatedAt:nowISO(),
      mainSections:defaultMainTitles.map(t=>createSection(t,'main')),
      aplusSections:defaultAplusTitles.map(t=>createSection(t,'aplus'))
    };
  }
  function workspaceStateKey(){
    return cloudWorkspace?.id ? `${STATE_KEY}:${cloudWorkspace.id}` : STATE_KEY;
  }
  function emptyState(){
    return {version:7,view:'projects',selectedProjectId:'',activeTab:'main',projects:[]};
  }

  function initialState(){
    const p=createProject('示例项目｜产品视觉策划方案');
    p.brief='填写产品定位、目标人群、核心卖点、竞品参考和整体视觉方向。所有修改都会自动保存。';
    p.mainSections[0].copy='产品名称 / 核心关键词 / 必须保留的产品外观要求';
    p.mainSections[0].scene='纯白背景，产品居中，主体占画面约85%，产品外观严格保持参考图一致。';
    p.mainSections[0].prompts[0].manual='商业棚拍灯光，高清细节，边缘干净，符合电商平台主图规范。';
    p.aplusSections[0].copy='主标题：Brand Story / Product Advantage\n副标题：用一句话说明产品价值';
    p.aplusSections[0].scene='宽幅品牌海报，产品位于视觉中心，背景体现目标用户使用场景。';
    p.aplusSections[0].prompts[0].manual='电影级柔和光线，高端商业广告风格，画面干净、可信。';
    return {version:7,view:'projects',selectedProjectId:p.id,activeTab:'main',projects:[p]};
  }

  function migrateSection(section,type){
    const s=section||{};
    let prompts=[];
    if(Array.isArray(s.prompts)){
      prompts=s.prompts.map(p=>({id:p?.id||uid(),manual:String(p?.manual??p?.promptManual??'')}));
    }else{
      const manual=s.promptManual!==undefined?s.promptManual:stripAutoPrompt(s.prompt||'',s);
      prompts=[createPrompt(manual||'')];
    }
    if(!prompts.length)prompts=[createPrompt()];
    return {
      id:s.id||uid(), title:s.title||'未命名板块',
      referenceImages:Array.isArray(s.referenceImages)?s.referenceImages:(Array.isArray(s.primaryImages)?s.primaryImages:[]),
      materialImages:Array.isArray(s.materialImages)?s.materialImages:(Array.isArray(s.secondaryImages)?s.secondaryImages:[]),
      copy:s.copy||'', scene:s.scene||'',
      size:s.size|| (type==='aplus'?'1464 × 600 px / 21:9':'2000 × 2000 px / 1:1'),
      prompts, updatedAt:s.updatedAt||nowISO()
    };
  }
  function migrateProject(project){
    const p=project||{};
    return {
      id:p.id||uid(), name:p.name||'未命名项目', brief:p.brief||'',
      productImages:Array.isArray(p.productImages)?p.productImages:[], bulkPrompt:p.bulkPrompt||'',
      createdAt:p.createdAt||nowISO(), updatedAt:p.updatedAt||nowISO(),
      mainSections:(Array.isArray(p.mainSections)?p.mainSections:defaultMainTitles.map(t=>createSection(t,'main'))).map(s=>migrateSection(s,'main')),
      aplusSections:(Array.isArray(p.aplusSections)?p.aplusSections:defaultAplusTitles.map(t=>createSection(t,'aplus'))).map(s=>migrateSection(s,'aplus'))
    };
  }
  function migrateState(raw){
    if(!raw||!Array.isArray(raw.projects)) return emptyState();
    const projects=raw.projects.map(migrateProject);
    return {
      version:7,
      view:raw.view==='workspace'?'workspace':'projects',
      selectedProjectId:projects.some(p=>p.id===raw.selectedProjectId)?raw.selectedProjectId:(projects[0]?.id||''),
      activeTab:raw.activeTab==='aplus'?'aplus':'main',
      projects
    };
  }

  function stripAutoPrompt(text,section){
    const t=String(text||'');
    const markerIndex=t.indexOf(PROMPT_MARKER);
    if(markerIndex>=0) return t.slice(markerIndex+PROMPT_MARKER.length).trim();
    const prefix=buildAutoPrefix(section||{});
    if(prefix && t.startsWith(prefix)) return t.slice(prefix.length).trim();
    return t;
  }
  function buildAutoPrefix(section){
    const title=String(section?.title||'未命名板块').trim()||'未命名板块';
    const size=String(section?.size||'').trim();
    const copy=String(section?.copy||'').trim();
    return `${title}
比例：${size}
文案：
${copy}`;
  }
  function buildPrompt(section,prompt){
    const manual=String(prompt?.manual||'').trim();
    return `${buildAutoPrefix(section)}\n\n${PROMPT_MARKER}${manual?`\n${manual}`:''}`;
  }
  function buildAllPrompts(section){
    const prompts=Array.isArray(section?.prompts)?section.prompts:[];
    return prompts.map((prompt,index)=>`【提示词 ${String(index+1).padStart(2,'0')}】\n${buildPrompt(section,prompt)}`).join('\n\n━━━━━━━━━━━━━━━━━━━━\n\n');
  }
  function extractManualPrompt(text){
    const t=String(text||'');
    const i=t.indexOf(PROMPT_MARKER);
    return i>=0?t.slice(i+PROMPT_MARKER.length).replace(/^\s+/, ''):t;
  }

  function openDB(){
    return new Promise(resolve=>{
      try{
        const req=indexedDB.open(DB_NAME,1);
        req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE_NAME))req.result.createObjectStore(STORE_NAME)};
        req.onsuccess=()=>{db=req.result;resolve(db)};
        req.onerror=()=>resolve(null);
      }catch(e){resolve(null)}
    });
  }
  function dbGet(key){
    return new Promise(resolve=>{
      if(!db)return resolve(null);
      try{
        const req=db.transaction(STORE_NAME,'readonly').objectStore(STORE_NAME).get(key);
        req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null);
      }catch(e){resolve(null)}
    });
  }
  function dbSet(key,value){
    return new Promise(resolve=>{
      if(!db){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}return resolve()}
      try{
        const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(value,key);
        tx.oncomplete=()=>resolve();tx.onerror=()=>resolve();
      }catch(e){resolve()}
    });
  }
  async function loadState(){
    await openDB();
    const hasSession=await checkCloudSession();
    if(hasSession){
      const scopedKey=workspaceStateKey();
      try{
        const data=await apiFetch('/api/state');
        cloudStateUpdatedAt=data?.updatedAt||'';
        if(data?.state){
          state=migrateState(data.state);
        }else{
          // 团队隔离强制规则：云端没有数据时，新团队必须是空项目库。
          // 这里绝对不能读取浏览器本地缓存，否则同一台电脑切换团队会串项目。
          state=emptyState();
          const saved=await apiFetch('/api/state',{method:'PUT',body:{state}});
          cloudStateUpdatedAt=saved?.updatedAt||cloudStateUpdatedAt;
        }
        await dbSet(scopedKey,state);
      }catch(e){
        console.warn('云端数据读取失败',e);
        state=emptyState();
        toast('云端读取失败，请检查登录状态和 D1 绑定');
      }
      return;
    }
    // 未登录时只显示登录/注册页，不读取任何项目缓存，避免跨团队串数据。
    state=emptyState();
  }
  async function saveState(show=false){
    if(!state)return;
    const p=getProject();if(p)p.updatedAt=nowISO();
    await dbSet(workspaceStateKey(),state);updateSaveStatus();
    if(cloudUser&&cloudApiReady){
      try{const saved=await apiFetch('/api/state',{method:'PUT',body:{state}});cloudStateUpdatedAt=saved?.updatedAt||cloudStateUpdatedAt;updateSaveStatus();queueRealtimeBroadcast()}
      catch(e){console.warn('云端同步失败',e);if(show)toast('本地已保存，云端同步失败')}
    }
    if(show)toast(cloudUser?'已保存并同步到云端':'已保存到本地');
  }
  function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveState(false),520)}

  function findSection(id){const p=getProject();return [...p.mainSections,...p.aplusSections].find(s=>s.id===id)}

  function bindWorkspaceEvents(){
    bindCloudButtons();
    const p=getProject();
    $('#backProjects').onclick=()=>{state.view='projects';scheduleSave();render()};
    $('#projectName').addEventListener('input',e=>{p.name=e.target.value;touch()});
    $('#projectBrief').addEventListener('input',e=>{p.brief=e.target.value;touch()});
    $('#bulkPromptText').addEventListener('input',e=>{p.bulkPrompt=e.target.value;touch()});
    $('#clearBulkPrompt').onclick=()=>{p.bulkPrompt='';$('#bulkPromptText').value='';touch();toast('批量内容已清空')};
    $('#applyBulkPrompt').onclick=()=>applyBulkPrompt(p);
    $('#saveNow').onclick=()=>saveState(true);
    $('#duplicateProject').onclick=duplicateProject;
    $('#deleteCurrentProject').onclick=()=>deleteProject(p.id);
    $('#addSection').onclick=addSection;
    $$('.tab').forEach(btn=>btn.onclick=()=>{state.activeTab=btn.dataset.tab;scheduleSave();renderWorkspace()});

    $$('.section').forEach(el=>{
      const s=findSection(el.dataset.sectionId);
      $$('[data-field]',el).forEach(input=>{
        const field=input.dataset.field;
        input.addEventListener('input',()=>{
          if(field==='promptCombined'){
            const prompt=s.prompts.find(p=>p.id===input.dataset.promptId);
            if(prompt)prompt.manual=extractManualPrompt(input.value);
          }else s[field]=input.value;
          s.updatedAt=nowISO();scheduleSave();
          if(field==='title'||field==='size'||field==='copy'){
            $$('.prompt-item',el).forEach(item=>{
              const prompt=s.prompts.find(p=>p.id===item.dataset.promptId);
              const textarea=$('[data-field="promptCombined"]',item);
              if(!prompt||!textarea)return;
              const start=textarea.selectionStart,end=textarea.selectionEnd;
              textarea.value=buildPrompt(s,prompt);
              const pos=Math.min(textarea.value.length,start);try{textarea.setSelectionRange(pos,Math.min(textarea.value.length,end))}catch(e){}
            });
          }
        });
      });
      el.addEventListener('click',e=>{
        const action=e.target.closest('[data-action]')?.dataset.action;
        const promptItem=e.target.closest('.prompt-item');
        const prompt=promptItem?s.prompts.find(p=>p.id===promptItem.dataset.promptId):null;
        if(action==='delete-section')deleteSection(s.id);
        if(action==='apply-size-current-demand')applySizeToCurrentDemand(s);
        if(action==='copy-prompt')copyText(buildAllPrompts(s));
        if(action==='add-prompt'){s.prompts.push(createPrompt());s.updatedAt=nowISO();scheduleSave();renderWorkspace();toast('已增加一条提示词')}
        if(action==='delete-prompt'&&prompt){
          if(!confirm('确定删除这条提示词吗？'))return;
          s.prompts=s.prompts.filter(p=>p.id!==prompt.id);s.updatedAt=nowISO();scheduleSave();renderWorkspace();toast('提示词已删除');
        }
        if(action==='refresh-single-prompt'&&prompt){$('[data-field="promptCombined"]',promptItem).value=buildPrompt(s,prompt);toast('自动内容已刷新')}
        if(action==='copy-single-prompt'&&prompt)copyText(buildPrompt(s,prompt));
        if(action==='append-copy-to-prompt'){
          const copy=String(s.copy||'').trim();
          if(!copy){toast('请先填写文案');return}
          if(!s.prompts.length)s.prompts.push(createPrompt());
          s.prompts.forEach(prompt=>{const current=String(prompt.manual||'').replace(/\s+$/,'');prompt.manual=current?`${current}\n\n${copy}`:copy});
          s.updatedAt=nowISO();scheduleSave();renderWorkspace();
          toast(`文案已追加到 ${s.prompts.length} 条 AI 提示词末尾`);
        }
      });
    });
    bindAllImageBoxes();
    bindRealtimeInputs();
  }

  function bindAllImageBoxes(){
    $$('.image-box').forEach(box=>{
      const scope=box.dataset.imageScope,ownerId=box.dataset.ownerId,field=box.dataset.imageField;
      const input=$('.image-file',box);
      const activate=()=>setActiveImageTarget(scope,ownerId,field,box);
      box.addEventListener('click',e=>{
        const thumb=e.target.closest('.thumb');
        const imgAction=e.target.closest('[data-image-action]')?.dataset.imageAction;
        if(imgAction==='upload'){e.stopPropagation();activate();input.click();return}
        if(imgAction==='clear'){e.stopPropagation();activate();clearImages(scope,ownerId,field);return}
        if(imgAction==='remove'){e.stopPropagation();removeImage(scope,ownerId,field,e.target.closest('[data-image-id]').dataset.imageId);return}
        if(thumb){openLightboxFromThumb(scope,ownerId,thumb.dataset.imageId);return}
        activate();
      });
      box.addEventListener('focus',activate);
      input.addEventListener('change',async e=>{const files=Array.from(e.target.files||[]);if(files.length)await addImages(scope,ownerId,field,files);input.value=''});
      box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('drag')});
      box.addEventListener('dragleave',()=>box.classList.remove('drag'));
      box.addEventListener('drop',async e=>{e.preventDefault();box.classList.remove('drag');activate();const files=Array.from(e.dataTransfer.files||[]).filter(f=>f.type.startsWith('image/'));if(files.length)await addImages(scope,ownerId,field,files)});
    });
  }

  function setActiveImageTarget(scope,ownerId,field,box){
    activeImageTarget={scope,ownerId,field};$$('.image-box').forEach(x=>x.classList.remove('active'));box.classList.add('active');
  }
  function getImageOwner(scope,ownerId){return scope==='project'?getProject(ownerId):findSection(ownerId)}
  function getOwnerGallery(scope,ownerId){
    const owner=getImageOwner(scope,ownerId);if(!owner)return [];
    if(scope==='section'){
      const refs=(Array.isArray(owner.referenceImages)?owner.referenceImages:[]).map(img=>({...img,group:'参考图'}));
      const mats=(Array.isArray(owner.materialImages)?owner.materialImages:[]).map(img=>({...img,group:'图片素材'}));
      return [...refs,...mats];
    }
    return (Array.isArray(owner.productImages)?owner.productImages:[]).map(img=>({...img,group:'产品图片'}));
  }
  function openLightboxFromThumb(scope,ownerId,imageId){
    const gallery=getOwnerGallery(scope,ownerId);
    const index=Math.max(0,gallery.findIndex(img=>img.id===imageId));
    if(gallery.length)openLightbox(gallery,index);
  }
  async function clearImages(scope,ownerId,field){
    const owner=getImageOwner(scope,ownerId);if(!owner)return;
    if(!confirm('确定清空这个区域的全部图片吗？'))return;
    owner[field]=[];await saveState();renderWorkspace();toast('图片已清空');
  }
  async function removeImage(scope,ownerId,field,imageId){
    const owner=getImageOwner(scope,ownerId);if(!owner)return;
    owner[field]=(owner[field]||[]).filter(img=>img.id!==imageId);await saveState();renderWorkspace();toast('图片已删除');
  }
  async function addImages(scope,ownerId,field,files){
    const owner=getImageOwner(scope,ownerId);if(!owner)return;
    toast('正在处理图片……');let compressed=0,failed=0;
    owner[field]=Array.isArray(owner[field])?owner[field]:[];
    for(const file of files){
      if(!file.type.startsWith('image/'))continue;
      try{
        const result=await imageToDataUrlUnder1MB(file);
        if(result.compressed)compressed++;
        let imageRecord={id:uid(),name:file.name||'粘贴图片',dataUrl:result.dataUrl,bytes:result.bytes,originalBytes:file.size||result.bytes,createdAt:nowISO()};
        if(cloudUser&&cloudApiReady){
          try{const cloud=await uploadImageToCloud(result.dataUrl,imageRecord.name);imageRecord={...imageRecord,dataUrl:cloud.url,objectKey:cloud.key,bytes:cloud.bytes||imageRecord.bytes,storedIn:cloud.storedIn||'d1'}}
          catch(e){console.warn('图片云端上传失败，保留本地编码',e);failed++;continue}
        }
        owner[field].push(imageRecord);
      }catch(err){console.error(err);failed++}
    }
    await saveState();renderWorkspace();
    toast(failed?`已添加 ${files.length-failed} 张，${failed} 张处理失败`:compressed?`图片已添加，${compressed} 张已压缩到 1MB 内`:'图片已添加');
  }

  function imageToDataUrlUnder1MB(file){
    if(file.size&&file.size<=MAX_IMAGE_BYTES){
      return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({dataUrl:r.result,bytes:file.size,compressed:false});r.onerror=reject;r.readAsDataURL(file)});
    }
    return compressImage(file);
  }
  function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('图片读取失败'))};img.src=url})}
  function canvasBlob(canvas,type,quality){return new Promise(resolve=>canvas.toBlob(resolve,type,quality))}
  function blobDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
  async function compressImage(file){
    const img=await loadImage(file);let width=img.naturalWidth,height=img.naturalHeight;
    const maxEdge=2400;if(Math.max(width,height)>maxEdge){const r=maxEdge/Math.max(width,height);width=Math.round(width*r);height=Math.round(height*r)}
    let quality=.88,blob=null;
    for(let i=0;i<30;i++){
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width));canvas.height=Math.max(1,Math.round(height));
      const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      blob=await canvasBlob(canvas,'image/webp',quality)||await canvasBlob(canvas,'image/jpeg',quality);
      if(blob&&blob.size<=MAX_IMAGE_BYTES)break;
      if(quality>.5)quality-=.07;else{width*=.82;height*=.82;quality=.78}
    }
    if(!blob||blob.size>MAX_IMAGE_BYTES)throw new Error('无法压缩到1MB以内');
    return {dataUrl:await blobDataUrl(blob),bytes:blob.size,compressed:true};
  }
  function formatBytes(bytes){if(!bytes)return '0KB';return bytes<1048576?`${Math.max(1,Math.round(bytes/1024))}KB`:`${(bytes/1048576).toFixed(1)}MB`}

  function applySizeToCurrentDemand(sourceSection){
    const size=String(sourceSection?.size||'').trim();
    if(!size)return toast('请先填写像素要求 / 尺寸要求');
    const p=getProject(),list=getSections(p),label=state.activeTab==='aplus'?'详情页':'主图';
    list.forEach(section=>{section.size=size;section.updatedAt=nowISO()});
    scheduleSave();renderWorkspace();toast(`已将尺寸应用到当前${label}需求的 ${list.length} 个板块`);
  }

  function applyBulkPrompt(project){
    const content=String(project?.bulkPrompt||'').trim();
    if(!content)return toast('请先填写批量提示词内容');
    let count=0;
    [...project.mainSections,...project.aplusSections].forEach(section=>{
      if(!Array.isArray(section.prompts)||!section.prompts.length)section.prompts=[createPrompt()];
      section.prompts.forEach(prompt=>{
        const current=String(prompt.manual||'').replace(/\s+$/,'');
        prompt.manual=current?`${current}\n\n${content}`:content;count++;
      });
      section.updatedAt=nowISO();
    });
    scheduleSave();renderWorkspace();toast(`已更新 ${count} 条 AI 提示词`);
  }

  function addSection(){
    const p=getProject(),list=getSections(p),label=state.activeTab==='main'?'主图':'详情页';
    list.push(createSection(`${label} ${String(list.length+1).padStart(2,'0')}｜新增板块`,state.activeTab));scheduleSave();renderWorkspace();toast('已添加板块');
  }
  function deleteSection(id){
    const p=getProject(),list=getSections(p);if(list.length<=1)return toast('至少保留一个板块');
    if(!confirm('确定删除这个板块吗？'))return;
    if(state.activeTab==='main')p.mainSections=p.mainSections.filter(s=>s.id!==id);else p.aplusSections=p.aplusSections.filter(s=>s.id!==id);
    scheduleSave();renderWorkspace();toast('板块已删除');
  }
  function openProject(id){state.selectedProjectId=id;state.view='workspace';scheduleSave();render()}
  function duplicateProject(){
    const p=getProject(),clone=JSON.parse(JSON.stringify(p));clone.id=uid();clone.name=`${p.name}｜副本`;clone.createdAt=nowISO();clone.updatedAt=nowISO();
    const refresh=s=>({...s,id:uid(),referenceImages:[...s.referenceImages],materialImages:[...s.materialImages],prompts:(s.prompts||[]).map(prompt=>({...prompt,id:uid()}))});
    clone.mainSections=clone.mainSections.map(refresh);clone.aplusSections=clone.aplusSections.map(refresh);
    state.projects.unshift(clone);state.selectedProjectId=clone.id;state.view='workspace';scheduleSave();render();toast('项目已复制');
  }
  async function deleteProject(id){
    const p=getProject(id);if(!p)return;if(!confirm(`确定删除项目“${p.name}”吗？此操作不可撤销。`))return;
    state.projects=state.projects.filter(x=>x.id!==id);
    if(!state.projects.length){const n=createProject('新项目');state.projects.push(n);state.selectedProjectId=n.id}else if(state.selectedProjectId===id)state.selectedProjectId=state.projects[0].id;
    state.view='projects';await saveState();render();toast('项目已删除');
  }

  function showProjectModal(){$('#projectModal').classList.add('show');$('#newProjectName').value='';setTimeout(()=>$('#newProjectName').focus(),20)}
  function hideProjectModal(){$('#projectModal').classList.remove('show')}
  function createProjectFromModal(){
    const p=createProject($('#newProjectName').value.trim()||'未命名项目');state.projects.unshift(p);state.selectedProjectId=p.id;state.activeTab='main';state.view='workspace';hideProjectModal();scheduleSave();render();toast('项目已创建');
  }

  function exportData(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`proposal-design-planner-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('数据已导出');
  }
  function importData(file){
    const r=new FileReader();r.onload=async()=>{try{state=migrateState(JSON.parse(r.result));await saveState();render();toast('数据已导入')}catch(e){toast('导入失败：文件格式不正确')}};r.readAsText(file);
  }
  async function copyText(text){
    try{await navigator.clipboard.writeText(text||'');toast('提示词已复制')}catch(e){const ta=document.createElement('textarea');ta.value=text||'';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('提示词已复制')}
  }
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2200)}
  function updateSaveStatus(){const p=getProject(),el=$('#saveStatus');if(p&&el)el.textContent=`${cloudUser?'云端同步：':'更新：'}${formatTime(p.updatedAt)}`}

  function openLightbox(gallery,startIndex=0){
    lightboxGallery=Array.isArray(gallery)?gallery:[];
    lightboxIndex=Math.min(Math.max(0,startIndex||0),Math.max(0,lightboxGallery.length-1));
    updateLightbox();
    $('#lightbox').classList.add('show');$('#lightbox').setAttribute('aria-hidden','false');
  }
  function updateLightbox(){
    const img=lightboxGallery[lightboxIndex];
    if(!img)return;
    $('#lightboxImage').src=img.dataUrl;
    const count=lightboxGallery.length;
    $('#lightboxCaption').textContent=`${lightboxIndex+1} / ${count} · ${img.group?img.group+' · ':''}${img.name||'图片预览'}`;
    $('#lightboxPrev').classList.toggle('disabled',count<=1);
    $('#lightboxNext').classList.toggle('disabled',count<=1);
  }
  function moveLightbox(step){
    if(lightboxGallery.length<=1)return;
    lightboxIndex=(lightboxIndex+step+lightboxGallery.length)%lightboxGallery.length;
    updateLightbox();
  }
  function closeLightbox(){
    $('#lightbox').classList.remove('show');$('#lightbox').setAttribute('aria-hidden','true');
    setTimeout(()=>{$('#lightboxImage').src='';lightboxGallery=[];lightboxIndex=0},150);
  }

  function bindAuthEvents(){
    $$('.auth-tab').forEach(btn=>btn.onclick=()=>{
      $$('.auth-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
      $('#loginForm').classList.toggle('hidden',btn.dataset.authTab!=='login');
      $('#registerForm').classList.toggle('hidden',btn.dataset.authTab!=='register');
      showAuthError('');
    });
    $('#loginForm').onsubmit=async e=>{
      e.preventDefault();showAuthError('');
      try{await apiFetch('/api/auth/login',{method:'POST',body:{email:$('#loginEmail').value.trim(),password:$('#loginPassword').value}});await loadState();render();toast('登录成功，已同步云端数据')}
      catch(err){showAuthError(err.message||'登录失败')}
    };
    $('#registerForm').onsubmit=async e=>{
      e.preventDefault();showAuthError('');
      try{await apiFetch('/api/auth/register',{method:'POST',body:{name:$('#registerName').value.trim(),email:$('#registerEmail').value.trim(),password:$('#registerPassword').value,inviteCode:$('#registerInvite').value.trim()}});await loadState();render();toast('注册成功，已启用云端同步')}
      catch(err){showAuthError(err.message||'注册失败')}
    };
  }
  function showAuthError(message){const el=$('#authError');if(!el)return;el.textContent=message||'';el.classList.toggle('show',!!message)}
  function bindCloudButtons(){
    $$('[data-action="logout-cloud"]').forEach(btn=>btn.onclick=async()=>{
      try{await saveState(false);await apiFetch('/api/auth/logout',{method:'POST',body:{}})}catch(e){}
      disconnectRealtime();cloudUser=null;cloudWorkspace=null;cloudApiReady=true;render();toast('已退出登录');
    });
  }

  document.addEventListener('paste',async e=>{
    if(!activeImageTarget||state.view!=='workspace')return;
    const files=Array.from(e.clipboardData?.items||[]).filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
    if(files.length){e.preventDefault();await addImages(activeImageTarget.scope,activeImageTarget.ownerId,activeImageTarget.field,files)}
  });
  $('#navProjects').onclick=()=>{state.view='projects';scheduleSave();render()};
  $('#navCurrent').onclick=()=>{if(getProject()){state.view='workspace';scheduleSave();render()}else toast('暂无项目')};
  $('#sideAddProject').onclick=showProjectModal;
  $('#sideExport').onclick=exportData;
  $('#sideImport').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=e=>{const f=e.target.files?.[0];if(f)importData(f);e.target.value=''};
  $('#cancelProject').onclick=hideProjectModal;
  $('#confirmProject').onclick=createProjectFromModal;
  $('#newProjectName').onkeydown=e=>{if(e.key==='Enter')createProjectFromModal()};
  $('#projectModal').onclick=e=>{if(e.target.id==='projectModal')hideProjectModal()};
  $('#lightboxClose').onclick=closeLightbox;
  $('#lightboxPrev').onclick=e=>{e.stopPropagation();moveLightbox(-1)};
  $('#lightboxNext').onclick=e=>{e.stopPropagation();moveLightbox(1)};
  $('#lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLightbox()};
  document.addEventListener('keydown',e=>{
    const lightboxOpen=$('#lightbox').classList.contains('show');
    if(lightboxOpen&&e.key==='ArrowLeft'){e.preventDefault();moveLightbox(-1)}
    if(lightboxOpen&&e.key==='ArrowRight'){e.preventDefault();moveLightbox(1)}
    if(e.key==='Escape'){closeLightbox();hideProjectModal()}
  });
  window.addEventListener('beforeunload',()=>{sendRealtime({type:'editing:end'});if(saveTimer)saveState(false)});

  loadState().then(()=>{render();saveState(false)});
})();
</script>
</body>
